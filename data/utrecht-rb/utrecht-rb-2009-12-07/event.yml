description: |-
    Hei Rubyists out there!
    Tomorrow is the first Monday of the month again, so it's time for another meeting of the Ruby User Group "Utrecht.rb". Since it's December, it'll be the last one of 2009, so it would be nice if you all would be able to make it! After a lot of meetings at the Stairway and some in the Winkel van Sinkel, we will be meeting up again this time at Grand Cafe Carré in Utrecht, http://www.grandcafecarre.nl./adres.htm It's at Mariaplaats 7, which is fairly close to the Stairway to Heaven, so it should be easy to find. If you are hungry, you can also have some good food there at a decent price: http://www.grandcafecarre.nl./alacarte.php

    Last meeting some of us did some pair programming, code refactoring and optimisations, so if anyone has some code they'd like to get refactored or optimised, bring it with you. Perhaps we can pair a bit on it. Of course you can also come to just have some good conversations over a couple of beers (or ice teas), or to show off this lovely new project of yours that you've been hiding in the basement for years ;) If you plan on coming, please give a shout here, or on twitter so we have a general idea of how many will be coming :) So, see you all in Utrecht tomorrow!
